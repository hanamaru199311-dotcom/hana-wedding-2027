<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wedding RSVP | 管理画面</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#193a32;background:#f7f4eb}*{box-sizing:border-box}body{margin:0}header{background:#183c32;color:#fff;padding:28px 20px}header h1{font-size:22px;margin:5px 0}header p{opacity:.8;font-size:12px}main{max-width:1080px;margin:auto;padding:20px}section{background:white;border:1px solid #e5dfcf;border-radius:12px;padding:18px;margin:0 0 18px}input,button{font:inherit;border-radius:7px;padding:12px;border:1px solid #bcb9ad}input{width:100%}button{background:#193a32;color:#fff;border:0;cursor:pointer}button.secondary{background:#ece7d9;color:#193a32}form{display:flex;gap:8px;flex-wrap:wrap}form input{flex:1;min-width:180px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:16px;background:#f4f0e5;border-radius:8px}.stat b{display:block;font-size:27px;margin-top:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.controls input{max-width:360px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{border-bottom:1px solid #e9e5dc;text-align:left;padding:12px 9px}th{background:#f6f3eb}small{color:#67756f}#msg{color:#a04438}details{max-width:320px;white-space:normal}summary{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}footer{padding:20px;text-align:center;font-size:12px;color:#667} @media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}} </style></head><body><header><p>HANA WEDDING 2027</p><h1>ご出欠 管理画面</h1><p>回答情報は管理者のみ閲覧できます</p></header><main><section id="login"><h2>管理者ログイン</h2><p>Cloudflareに設定した管理用パスワードを入力してください。</p><form id="loginForm"><input id="password" type="password" autocomplete="off" placeholder="管理用パスワード" required><button>表示する</button></form><p id="msg" role="alert"></p></section><div id="dashboard" class="hidden"><section><div class="controls"><button id="refresh">更新</button><button class="secondary" id="csv">CSVを保存</button><button class="secondary" id="logout">ログアウト</button></div><div class="stats" id="stats"></div></section><section><h2>回答一覧</h2><div class="controls"><input id="search" placeholder="名前・メールアドレスで検索"></div><small id="count"></small><div class="tablewrap"><table><thead><tr><th>回答日時</th><th>お名前</th><th>メール</th><th>挙式・披露宴</th><th>二次会</th><th>宿泊</th><th>お子様</th><th>その他の回答</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><footer>Private RSVP dashboard</footer><script>
let token='',items=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function txt(v){return v==null?'':String(v)}function extra(r){try{const p=JSON.parse(r.payload||'{}');return JSON.stringify(p,null,2)}catch{return txt(r.payload)}}function render(){const q=$('search').value.toLowerCase().trim();const data=items.filter(r=>(txt(r.guest)+' '+txt(r.email)).toLowerCase().includes(q));$('count').textContent=`${data.length} 件表示 / 全 ${items.length} 件`;$('rows').innerHTML=data.map(r=>`<tr><td>${esc(r.created_at)}</td><td>${esc(r.guest)}</td><td>${esc(r.email)}</td><td>${esc(r.wedding)}</td><td>${esc(r.after_party)}</td><td>${esc(r.stay)}</td><td>${esc(r.children)}</td><td><details><summary>詳細</summary><pre>${esc(extra(r))}</pre></details></td></tr>`).join('');const count=(k,p)=>items.filter(r=>p(txt(r[k]))).length;$('stats').innerHTML=[['回答件数',items.length],['挙式・披露宴 出席',count('wedding',v=>v.includes('出席')&&!v.includes('欠席'))],['二次会 参加',count('after_party',v=>v.includes('参加')&&!v.includes('しない')&&!v.includes('不参加'))],['宿泊希望',count('stay',v=>v.includes('希望')&&!v.includes('しない'))]].map(([a,b])=>`<div class="stat">${esc(a)}<b>${b}</b></div>`).join('')}async function load(){const res=await fetch('/api/admin',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!res.ok)throw Error(res.status===401?'パスワードが違います':'取得できませんでした（'+res.status+'）');const data=await res.json();items=data.rows||[];$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('password').value='';$('msg').textContent='';render()}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();token=$('password').value.trim();try{await load()}catch(err){token='';$('msg').textContent=err.message}});$('refresh').onclick=async()=>{try{await load()}catch(e){alert(e.message)}};$('logout').onclick=()=>{token='';items=[];$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};$('search').oninput=render;$('csv').onclick=()=>{const headers=['created_at','guest','email','wedding','after_party','mayuko_seat','stay','children','payload'];const cells=[headers,...items.map(r=>headers.map(k=>txt(r[k])))];const csv='\ufeff'+cells.map(row=>row.map(s=>'"'+s.replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='wedding-rsvp.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
