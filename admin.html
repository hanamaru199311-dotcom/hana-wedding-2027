<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ご出欠 管理画面 | HANA WEDDING 2027</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#193a32;background:#f7f4eb}*{box-sizing:border-box}body{margin:0}header{background:#183c32;color:white;padding:30px 20px}header p{opacity:.8;font-size:12px;letter-spacing:.12em}header h1{margin:8px 0;font-size:25px}main{max-width:1060px;margin:auto;padding:18px 14px 50px}.panel{background:white;border:1px solid #e5dfcf;border-radius:15px;padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:190px;border:1px solid #c7c1b3;padding:12px;border-radius:8px;font-size:16px}button{border:0;border-radius:8px;background:#193a32;color:white;padding:12px 16px;font-size:15px;cursor:pointer}.secondary{background:#eee9db;color:#193a32}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:17px}.stat{background:#f3efe5;border-radius:10px;padding:17px}.stat span{font-size:13px}.stat strong{display:block;font-size:28px;margin-top:6px}h2{font-size:21px;margin:0 0 16px}.hint{font-size:13px;color:#65736d;line-height:1.6}.record{border:1px solid #e6e0d2;border-radius:12px;margin:13px 0;overflow:hidden}.record summary{list-style:none;cursor:pointer;padding:16px;background:#faf8f2}.record summary::-webkit-details-marker{display:none}.record summary:after{content:'詳細を見る ＋';float:right;color:#877247;font-size:12px}.record[open] summary:after{content:'閉じる −'}.record-title{font-size:17px;font-weight:700}.record-sub{font-size:12px;color:#68746e;margin-top:8px}.details{padding:10px 16px 18px}.group{border-top:1px solid #eee9dd;padding:15px 0 5px}.group h3{font-size:15px;margin:0 0 10px;color:#957c47}.field{display:grid;grid-template-columns:minmax(100px,35%) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #f2eee6;font-size:14px}.field .key{color:#6d7973}.field .val{white-space:pre-wrap;overflow-wrap:anywhere}.child{padding:12px;background:#f8f5ed;border-radius:8px;margin:10px 0}.child b{display:block;margin-bottom:6px}.empty{padding:24px;text-align:center;color:#7c837e}#status{font-size:13px;color:#a04736;margin-top:12px}footer{text-align:center;padding:20px;color:#758079;font-size:12px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}.panel{padding:28px}.field{grid-template-columns:210px 1fr}}</style></head><body><header><p>HANA WEDDING 2027</p><h1>ご出欠 管理画面</h1><p>招待状の全回答項目を表示</p></header><main><section class="panel"><div class="toolbar"><button id="refresh">更新</button><button class="secondary" id="csv">CSVを保存</button><input id="search" placeholder="お名前・メールアドレスで検索"></div><div id="status" role="status"></div><div class="stats" id="stats"></div></section><section class="panel"><h2>回答一覧</h2><p class="hint">お名前を押すと、宿泊・お子様・アレルギー・自由記入まで確認できます。</p><p class="hint" id="count"></p><div id="records"></div></section></main><footer>Wedding RSVP dashboard</footer><script>
let items=[];const $=id=>document.getElementById(id);const str=v=>v==null?'':String(v);const esc=v=>str(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(k,v)=>`<div class="field"><div class="key">${esc(k)}</div><div class="val">${esc(v||'未回答')}</div></div>`;function payload(r){try{return JSON.parse(r.payload||'{}')}catch{return {}}}function render(){const q=$('search').value.toLowerCase().trim();const shown=items.filter(r=>(str(r.guest)+' '+str(r.email)).toLowerCase().includes(q));$('count').textContent=`${shown.length} 件表示 / 全 ${items.length} 件`;const count=(k,p)=>items.filter(r=>p(str(r[k]))).length;$('stats').innerHTML=[['回答件数',items.length],['挙式・披露宴 出席',count('wedding',v=>v==='出席する')],['二次会 参加',count('after_party',v=>v==='参加する')],['宿泊希望',count('stay',v=>v==='希望する')]].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');$('records').innerHTML=shown.length?shown.map(r=>{const p=payload(r),n=Math.min(5,Number(p.childCount)||0);let children='';if(p.children==='同伴する'){for(let i=1;i<=n;i++)children+=`<div class="child"><b>お子様 ${i}</b>${field('お名前',p['childName'+i])}${field('年齢',p['childAge'+i])}${field('お食事のご希望',p['childMeal'+i])}</div>`}return `<details class="record"><summary><div class="record-title">${esc(r.guest)}</div><div class="record-sub">${esc(r.created_at)}　｜　挙式・披露宴：${esc(r.wedding)}　｜　二次会：${esc(r.after_party)}</div></summary><div class="details"><div class="group"><h3>01　基本情報</h3>${field('お名前',p.guest||r.guest)}${field('メールアドレス',p.email||r.email)}${field('回答日時',r.created_at)}</div><div class="group"><h3>02　挙式・披露宴</h3>${field('出欠',p.wedding||r.wedding)}</div><div class="group"><h3>03　二次会</h3>${field('参加希望',p.after||r.after_party)}${field('華の母・まゆ子との同じテーブル',p.mayukoSeat||r.mayuko_seat)}</div><div class="group"><h3>04　ホテル宿泊</h3>${field('宿泊希望',p.stay||r.stay)}${field('チェックイン希望日',p.checkin)}${field('宿泊人数',p.people)}${field('同室希望者のお名前',p.roommate)}</div><div class="group"><h3>05　お子様</h3>${field('お子様同伴',p.children||r.children)}${field('お子様の人数',p.childCount?p.childCount+'名':'')}${children}</div><div class="group"><h3>06　その他</h3>${field('食物アレルギー',p.allergy)}${field('メッセージ・備考',p.note)}</div></div></details>`}).join(''):'<div class="empty">該当する回答はありません</div>'}async function load(){const s=$('status');s.textContent='読み込み中…';try{const res=await fetch('/api/admin',{cache:'no-store'});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'取得できませんでした');items=data.rows||[];s.textContent='';render()}catch(e){s.textContent='読み込みに失敗しました：'+e.message}}$('refresh').onclick=load;$('search').oninput=render;$('csv').onclick=()=>{const cols=[['created_at','回答日時'],['guest','お名前'],['email','メールアドレス'],['wedding','挙式・披露宴'],['after','二次会'],['mayukoSeat','まゆ子さんとの同席'],['stay','宿泊希望'],['checkin','チェックイン希望日'],['people','宿泊人数'],['roommate','同室希望者'],['children','お子様同伴'],['childCount','お子様の人数']];for(let i=1;i<=5;i++)cols.push(['childName'+i,'お子様'+i+'名前'],['childAge'+i,'お子様'+i+'年齢'],['childMeal'+i,'お子様'+i+'食事']);cols.push(['allergy','アレルギー'],['note','備考']);const values=[cols.map(c=>c[1]),...items.map(r=>{const p=payload(r);return cols.map(([k])=>str(p[k]??r[k]??''))})];const csv='\ufeff'+values.map(a=>a.map(x=>'"'+x.replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='wedding-rsvp-all-answers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};load();
</script></body></html>
