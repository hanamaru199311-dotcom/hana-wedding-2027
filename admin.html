
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Wedding RSVP | 管理画面</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#193a32;background:#f7f4eb}
*{box-sizing:border-box}
body{margin:0}
header{background:#183c32;color:white;padding:28px 20px}
header h1{font-size:22px;margin:5px 0}
header p{opacity:.8;font-size:12px}
main{max-width:1080px;margin:auto;padding:20px}
section{background:white;border:1px solid #e5dfcf;border-radius:12px;padding:18px;margin-bottom:18px}
button,input{font:inherit;border-radius:7px;padding:12px}
button{background:#193a32;color:white;border:0;cursor:pointer}
button.secondary{background:#ece7d9;color:#193a32}
input{border:1px solid #bcb9ad;width:100%;max-width:360px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:16px;background:#f4f0e5;border-radius:8px}
.stat b{display:block;font-size:27px;margin-top:8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border-bottom:1px solid #e9e5dc;text-align:left;padding:12px 9px}
th{background:#f6f3eb}
small{color:#67756f}
details{max-width:320px;white-space:normal}
summary{cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px}
footer{padding:20px;text-align:center;font-size:12px;color:#667}
#error{color:#a04438}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<p>HANA WEDDING 2027</p>
<h1>ご出欠 管理画面</h1>
<p>回答一覧・集計</p>
</header>
<main>
<section>
<div class="controls">
<button id="refresh">更新</button>
<button class="secondary" id="csv">CSVを保存</button>
</div>
<p id="status">回答を読み込んでいます...</p>
<p id="error" role="alert"></p>
<div class="stats" id="stats"></div>
</section>
<section>
<h2>回答一覧</h2>
<div class="controls">
<input id="search" placeholder="名前・メールアドレスで検索">
</div>
<small id="count"></small>
<div class="tablewrap">
<table>
<thead><tr>
<th>回答日時</th><th>お名前</th><th>メール</th>
<th>挙式・披露宴</th><th>二次会</th><th>宿泊</th>
<th>お子様</th><th>その他の回答</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
<footer>Wedding RSVP dashboard</footer>
<script>
let items=[];
const $=id=>document.getElementById(id);
function txt(v){return v==null?'':String(v)}
function esc(v){
return txt(v).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]))
}
function extra(r){
try{return JSON.stringify(JSON.parse(r.payload||'{}'),null,2)}
catch{return txt(r.payload)}
}
function render(){
const q=$('search').value.toLowerCase().trim();
const data=items.filter(r=>
(txt(r.guest)+' '+txt(r.email)).toLowerCase().includes(q));
$('count').textContent=`${data.length} 件表示 / 全 ${items.length} 件`;
$('rows').innerHTML=data.map(r=>`
<tr>
<td>${esc(r.created_at)}</td>
<td>${esc(r.guest)}</td>
<td>${esc(r.email)}</td>
<td>${esc(r.wedding)}</td>
<td>${esc(r.after_party)}</td>
<td>${esc(r.stay)}</td>
<td>${esc(r.children)}</td>
<td><details><summary>詳細</summary><pre>${esc(extra(r))}</pre></details></td>
</tr>`).join('');
const count=(k,p)=>items.filter(r=>p(txt(r[k]))).length;
$('stats').innerHTML=[
['回答件数',items.length],
['挙式・披露宴 出席',count('wedding',v=>v.includes('出席')&&!v.includes('欠席'))],
['二次会 参加',count('after_party',v=>v.includes('参加')&&!v.includes('しない')&&!v.includes('不参加'))],
['宿泊希望',count('stay',v=>v.includes('希望')&&!v.includes('しない'))]
].map(([a,b])=>`<div class="stat">${esc(a)}<b>${b}</b></div>`).join('');
}
async function load(){
$('status').textContent='回答を読み込んでいます...';
$('error').textContent='';
try{
const res=await fetch('/api/admin',{cache:'no-store'});
if(!res.ok)throw Error('取得できませんでした（'+res.status+'）');
const data=await res.json();
items=data.rows||[];
render();
$('status').textContent='最新の回答を表示しています';
}catch(err){
$('status').textContent='';
$('error').textContent=err.message;
}
}
$('refresh').onclick=load;
$('search').oninput=render;
$('csv').onclick=()=>{
const headers=['created_at','guest','email','wedding','after_party','mayuko_seat','stay','children','payload'];
const cells=[headers,...items.map(r=>headers.map(k=>txt(r[k])))];
const csv='\ufeff'+cells.map(row=>row.map(s=>'"'+s.replace(/"/g,'""')+'"').join(',')).join('\r\n');
const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
const a=document.createElement('a');
a.href=url;
a.download='wedding-rsvp.csv';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};
load();
</script>
</body>
</html>
